# 排班规则。
# max_off_per_day / max_consecutive_work_days 等为硬约束（v0.1 起生效）；
# 其余字段供 v0.2 求解器打分使用。

# 每天最多几人休息，按组别配置。
# 注意：这是「上限」而非「必须休满」。
max_off_per_day:
  diagnosis: 3
  technician: 4
  nursing: 1

min_night_eligible:
  diagnosis: 6
  technician: 8

max_night_per_month: 6
min_rest_gap_h: 12
max_consecutive_work_days: 6
night_balance_weight: 10
holiday_weight: 2

# ---- v0.2 求解器参数 ----

# 每人每周期望休息天数（首要目标）。人力不足时自动降为 min_off_per_week。
target_off_per_week: 2
# 人力紧张时允许的最低休息天数（次要目标）。
min_off_per_week: 1
# 求解时限（秒）。
solve_time_limit_s: 30

rotation:
  technician: weekly
  attach_students: true
